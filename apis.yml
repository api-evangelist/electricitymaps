name: Electricity Maps
kind: company
description: Electricity Maps provides electricity grid data - carbon intensity and power production/consumption
  breakdown - for 200+ zones worldwide, in real time, as historical series, and as 24-72 hour forecasts.
  The REST API serves the same data behind the live electricity map at app.electricitymap.org, authenticated
  with an auth-token header.
